{% include base_path %}

<!-- start custom head snippets -->

<!-- TEST-MATHJAX-CUSTOM-HEAD -->

<!-- Lato (site typeface) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap">

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon -->
<link rel="apple-touch-icon"
      sizes="180x180"
      href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>

<link rel="icon"
      type="image/svg+xml"
      href="{{ base_path }}/images/favicon.svg"/>

<link rel="icon"
      type="image/png"
      href="{{ base_path }}/images/favicon-32x32.png"
      sizes="32x32"/>

<link rel="icon"
      type="image/png"
      href="{{ base_path }}/images/favicon-192x192.png"
      sizes="192x192"/>

<link rel="manifest"
      href="{{ base_path }}/images/manifest.json"/>

<link rel="icon" href="/images/favicon.ico"/>

<meta name="theme-color" content="#ffffff"/>

<!-- MathJax -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [
        ['$', '$'],
        ['\\(', '\\)']
      ],
      displayMath: [
        ['$$', '$$'],
        ['\\[', '\\]']
      ]
    }
  };
</script>

<script
  id="MathJax-script"
  async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>

<!-- end custom head snippets -->
